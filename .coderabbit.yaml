# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
tone_instructions: >-
  Be direct; skip praise and preamble. This is a browser extension plus local
  bridge that captures API tokens. Prioritize token handling, host permission
  scope, and bridge auth over style.
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true

  slop_detection:
    enabled: true
    label: slop

  path_filters:
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/vendor/**"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "**/*.{js,ts}"
      instructions: >-
        This tool captures a real API token from browser traffic and hands it to
        a local host process, so token handling is the security surface of the
        whole project.

        Flag any path that writes a captured token to disk unencrypted, logs it,
        includes it in an error report, or sends it anywhere other than the
        intended local bridge. Flag widening of extension host permissions or
        webRequest filters beyond the specific origin required.

        The local bridge must not accept commands from arbitrary web origins.
        Flag a bridge listener without origin checking or without a shared
        secret, since any page in the browser could otherwise drive it.

        Process-matching by name can match the checking process itself; flag
        liveness checks that can see their own command line and conclude a
        service is already running.
    - path: ".github/workflows/**"
      instructions: >-
        Check for unpinned third-party actions, secrets exposed to
        pull_request_target, and steps interpolating untrusted PR text into run
        blocks.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_usernames:
      - dependabot
      - dependabot[bot]

  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    languagetool:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
